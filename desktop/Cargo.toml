[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/link",
  "crates/sink",
  "crates/cli",
  "crates/app",
]
default-members = [
  "crates/protocol",
  "crates/link",
  "crates/sink",
  "crates/cli",
  "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cnryb/ai-passport-mic"

[workspace.dependencies]
apm-protocol = { path = "crates/protocol" }
apm-link = { path = "crates/link" }
apm-sink = { path = "crates/sink" }
apm-app = { path = "crates/app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
