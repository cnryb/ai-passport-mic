[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/link",
  "crates/sink",
  "crates/cli",
  "crates/app",
  "crates/gui",
]
# GUI 依赖 tauri（400+ crate，冷编译 5–8 分钟）。默认成员不含它：
# `cargo test` / `./scripts/verify.sh` 仍只跑轻量 crate，构建 GUI 显式用
# `cargo build -p apm-gui` 或 `./scripts/build-gui.sh`。
default-members = [
  "crates/protocol",
  "crates/link",
  "crates/sink",
  "crates/cli",
  "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cnryb/ai-passport-mic"

[workspace.dependencies]
apm-protocol = { path = "crates/protocol" }
apm-link = { path = "crates/link" }
apm-sink = { path = "crates/sink" }
apm-app = { path = "crates/app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
