[package]
name = "apmctl"
description = "AI Passport Mic 验收工具：scan / status / record / analyze / selftest"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "apmctl"
path = "src/main.rs"

[dependencies]
apm-protocol = { workspace = true }
apm-link = { workspace = true }
apm-sink = { workspace = true }
# 编排（采集/解码/丢块/声卡/指标）全在 apm-app：CLI 只解析参数与打印。
apm-app = { workspace = true }
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
