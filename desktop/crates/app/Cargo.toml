[package]
name = "apm-app"
description = "AI Passport Mic 的无 UI 应用内核：状态机、编排、事件与诊断日志"
version.workspace = true
edition.workspace = true
license.workspace = true

# 硬约束：本 crate 不允许依赖 tauri / 任何 GUI 框架。
# CLI 与 GUI 共用这里的逻辑，一旦引了 GUI 类型，CLI 就被绑死了。
[dependencies]
apm-protocol = { workspace = true }
apm-link = { workspace = true }
# 推流编排（G2）在这层做：声卡对象 !Send，只能在 session 模块自己的线程里活。
apm-sink = { workspace = true }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
espflash = { version = "4.7.0", default-features = false, features = ["serialport"] }
md-5 = "0.11.0"
serialport = "4"

# 按键注入（M3）只在 macOS 上实现，其他平台由 inject.rs 里的空实现兜住。
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
# 权限引导要用 AXIsProcessTrustedWithOptions，构造 options 字典需要 CF 类型。
core-foundation = "0.10"
